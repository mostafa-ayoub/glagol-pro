version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: glagol-pro-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: glagol123
      MONGO_INITDB_DATABASE: glagol_pro
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - glagol-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: glagol-pro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - glagol-network

  # Node.js Backend Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glagol-pro-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:glagol123@mongodb:27017/glagol_pro?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRE: 7d
      ALLOWED_ORIGINS: http://localhost:3001,http://localhost:5500
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      - glagol-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: glagol-pro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./glagol-pro-v5.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend
    networks:
      - glagol-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  glagol-network:
    driver: bridge
